<section><div><div class="tag">小祕密 01 · 聲音與情境</div><h2>呼嚕呼嚕，<br>一定很開心嗎？</h2><div class="rule"></div><p class="lead">還要看看牠的身體和當下情境。</p><div class="fact"><p>放鬆時可能呼嚕，<br>壓力或疼痛時也可能出現。</p></div><p>先看整體姿勢，<br>不只聽一個聲音就下結論。</p><p class="note">呼嚕也不能單獨證明疼痛。<br>依據：<a href="../wiki/sources/S03-cats-protection-body-language.md">S03 · Cats Protection</a></p></div><div class="art" style="background:#e7eddf"><div class="sticker sleep" role="img" aria-label="Luna 蜷睡貼圖，僅作放鬆情境示意"></div></div><footer><span>圖像僅作情境示意，不是診斷依據</span><span>02 / 樣稿</span></footer></section>
